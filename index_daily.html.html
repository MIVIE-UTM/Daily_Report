<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Report Builder</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#1b2a41;--mut:#5d6b80;--line:#dbe3ee;--navy:#1b365d;--teal:#0d9488;--inp:#f8fafc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#18222f;--ink:#e6edf6;--mut:#93a1b5;--line:#2a3748;--navy:#0b1a30;--teal:#2dd4bf;--inp:#111b27}}
:root[data-theme="dark"]{--bg:#0f1722;--card:#18222f;--ink:#e6edf6;--mut:#93a1b5;--line:#2a3748;--navy:#0b1a30;--teal:#2dd4bf;--inp:#111b27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:28px 20px 34px;border-bottom:4px solid var(--teal)}
header>div,main{max-width:760px;margin:0 auto}
h1{margin:0;font-size:26px;letter-spacing:.2px}
header p{margin:4px 0 0;opacity:.8}
main{padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 200px}
label{display:block;font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 4px}
input[type=text],input[type=date],input[type=url],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0}
.th{display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.th input{font-weight:600}
.pr{display:flex;align-items:center;gap:12px}
.pr input[type=range]{flex:1;accent-color:var(--teal)}
.pv{min-width:46px;text-align:right;font-weight:700}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.pri{background:var(--teal);color:#fff}.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.del{background:none;color:var(--mut);padding:4px 8px;font-size:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap}
#msg{margin-top:10px;color:var(--mut);font-size:13px;min-height:18px}
</style>
</head>
<body>
<header><div><h1>Daily Report Builder</h1><p>Fill in your tasks, then export a neat PDF.</p></div></header>
<main>
<div class="card">
<div class="row">
<div><label>Report date</label><input type="date" id="date"></div>
<div><label>Name (optional)</label><input type="text" id="name" placeholder="Your name"></div>
</div>
</div>
<div id="tasks"></div>
<div class="bar" style="margin-bottom:16px"><button class="sec" id="add">+ Add task</button></div>
<div class="card"><label style="margin-top:0">Reflection / Summary</label><textarea id="refl" placeholder="Summarise what you did today…"></textarea></div>
<div class="bar"><button class="pri" id="pdf">Download PDF</button><button class="sec" id="clear">Clear all</button></div>
<div id="msg"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY='daily-report-draft';
const blank=()=>({title:'',progress:0,details:'',justify:'',link:''});
let S={date:new Date().toISOString().slice(0,10),name:'',refl:'',tasks:[blank()]};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.tasks)&&o.tasks.length){S=Object.assign(S,o,{date:S.date})}}}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(){
 $('date').value=S.date;$('name').value=S.name;$('refl').value=S.refl;
 $('tasks').innerHTML=S.tasks.map((t,i)=>`<div class="card" data-i="${i}">
 <div class="th"><span class="num">${i+1}</span><input type="text" data-f="title" placeholder="Task title" value="${esc(t.title)}"><button class="del" data-del title="Remove">×</button></div>
 <label>Progress</label><div class="pr"><input type="range" min="0" max="100" step="5" data-f="progress" value="${t.progress}"><span class="pv">${t.progress}%</span></div>
 <label>Work details</label><textarea data-f="details" placeholder="What did you do?">${esc(t.details)}</textarea>
 <label>Continuation justification (optional)</label><textarea data-f="justify" placeholder="Why / when will it continue?">${esc(t.justify)}</textarea>
 <label>Evidence link (optional)</label><input type="url" data-f="link" placeholder="https://…" value="${esc(t.link)}"></div>`).join('');
}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='date')S.date=el.value;else if(el.id==='name')S.name=el.value;else if(el.id==='refl')S.refl=el.value;
 else if(el.dataset.f){const c=el.closest('[data-i]');const t=S.tasks[+c.dataset.i];t.progress=el.dataset.f==='progress'?+el.value:t.progress;
  if(el.dataset.f==='progress')c.querySelector('.pv').textContent=el.value+'%';else t[el.dataset.f]=el.value}
 save();
});
$('tasks').addEventListener('click',e=>{if(e.target.dataset.del!==undefined){S.tasks.splice(+e.target.closest('[data-i]').dataset.i,1);if(!S.tasks.length)S.tasks=[blank()];save();render()}});
$('add').onclick=()=>{S.tasks.push(blank());save();render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
$('clear').onclick=()=>{S.tasks=[blank()];S.refl='';save();render()};
const fmtDate=s=>{const[p,m,d]=s.split('-');return d+'/'+m+'/'+p};

function build(){
 const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});
 const W=210,M=18,CW=W-2*M,NAVY=[27,54,93],TEAL=[13,148,136],INK=[30,41,59],GREY=[100,110,125];
 let y=0;
 const ds=fmtDate(S.date);
 d.setFillColor(...NAVY);d.rect(0,0,W,34,'F');d.setFillColor(...TEAL);d.rect(0,34,W,1.6,'F');
 d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(22);d.text('Daily Report',M,17);
 d.setFont('helvetica','normal');d.setFontSize(10.5);d.text(S.name||' ',M,26);d.text(ds,W-M,17,{align:'right'});
 y=46;
 const ensure=h=>{if(y+h>282){d.addPage();y=20}};
 const label=t=>{ensure(10);d.setFont('helvetica','bold');d.setFontSize(8.5);d.setTextColor(...TEAL);d.text(t.toUpperCase(),M+4,y);y+=4.6};
 const para=(t,link)=>{d.setFont('helvetica','normal');d.setFontSize(10);
  d.splitTextToSize(t,CW-8).forEach(l=>{ensure(5);
   if(link){d.setTextColor(37,99,235);d.textWithLink(l,M+4,y,{url:t})}else{d.setTextColor(...INK);d.text(l,M+4,y)}y+=4.8});y+=2.5};
 S.tasks.filter(t=>t.title||t.details||t.link).forEach((t,i)=>{
  ensure(34);
  d.setFillColor(...TEAL);d.circle(M+4,y-1.2,3.4,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(9);d.text(String(i+1),M+4,y,{align:'center'});
  d.setTextColor(...NAVY);d.setFontSize(12.5);
  const tl=d.splitTextToSize(t.title||'Untitled task',CW-34);d.text(tl,M+11,y);
  d.setFontSize(10);d.setTextColor(...TEAL);d.text(t.progress+'%',W-M,y,{align:'right'});
  y+=(tl.length-1)*5.4+4;
  d.setFillColor(226,232,240);d.roundedRect(M,y,CW,2.4,1.2,1.2,'F');
  if(t.progress>0){d.setFillColor(...TEAL);d.roundedRect(M,y,Math.max(2.4,CW*t.progress/100),2.4,1.2,1.2,'F')}
  y+=8;
  if(t.details){label('Work details');para(t.details)}
  if(t.justify){label('Continuation justification');para(t.justify)}
  if(t.link){label('Evidence link');para(t.link,true)}
  d.setDrawColor(219,227,238);d.line(M,y,W-M,y);y+=8;
 });
 if(S.refl.trim()){
  d.setFontSize(10);const rl=d.splitTextToSize(S.refl,CW-10);
  ensure(Math.min(rl.length*4.8+22,60));
  d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(...NAVY);d.text('Reflection / Summary',M,y);y+=5;
  d.setFont('helvetica','normal');d.setFontSize(10);
  let start=y,chunk=[];
  const flush=()=>{if(!chunk.length)return;d.setFillColor(240,247,246);d.setDrawColor(...TEAL);d.rect(M,start-3,CW,chunk.length*4.8+5,'F');d.setFillColor(...TEAL);d.rect(M,start-3,1.2,chunk.length*4.8+5,'F');
   d.setTextColor(...INK);chunk.forEach((l,k)=>d.text(l,M+5,start+k*4.8+1));y=start+chunk.length*4.8+8;chunk=[]};
  rl.forEach(l=>{if(start+(chunk.length+1)*4.8>280){flush();d.addPage();y=20;start=y}chunk.push(l)});flush();
 }
 const n=d.getNumberOfPages();
 for(let p=1;p<=n;p++){d.setPage(p);d.setFontSize(8);d.setTextColor(...GREY);d.setFont('helvetica','normal');
  d.text('Daily Report · '+ds,M,291);d.text('Page '+p+' of '+n,W-M,291,{align:'right'})}
 return d;
}
$('pdf').onclick=async()=>{
 const m=$('msg');m.textContent='';
 if(!window.jspdf){m.textContent='The PDF library did not load. Please reload the page.';return}
 let d;try{d=build()}catch(e){m.textContent='Could not build the PDF: '+e.message;return}
 let dl=null;try{dl=await claude.use('downloads')}catch(e){}
 const fn='Daily_Report_'+S.date.split('-').reverse().join('-')+'.pdf';
 if(!dl){try{d.save(fn);m.textContent='PDF downloaded.'}catch(e){m.textContent='Could not save the PDF: '+e.message}return}
 try{await dl.save({filename:'Daily_Report_'+S.date.split('-').reverse().join('-')+'.pdf',data:d.output('blob')});m.textContent='PDF saved.'}
 catch(e){m.textContent=e&&e.code==='declined'?'Download cancelled.':'Could not save the PDF ('+(e&&e.code||'error')+').'}
};
render();
</script>
</body>
</html>
